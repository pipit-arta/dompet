<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catatan Keuangan Pribadi</title>
    <!-- Tailwind CSS untuk styling yang rapi dan cepat -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased min-h-screen p-4 sm:p-6">

    <div class="max-w-md mx-auto space-y-6">
        
        <!-- Header -->
        <header class="text-center">
            <h1 class="text-2xl font-bold text-slate-900">Dompet Pintar 💰</h1>
            <p class="text-sm text-slate-500">Catat pengeluaran & saldo secara praktis</p>
        </header>

        <!-- Kartu Ringkasan Keuangan -->
        <div class="bg-gradient-to-br from-blue-600 to-indigo-700 text-white p-6 rounded-2xl shadow-lg">
            <p class="text-sm font-medium text-blue-100">Sisa Saldo Bulanan</p>
            <h2 id="sisaSaldo" class="text-3xl font-bold mt-1 mb-4">Rp 0</h2>
            <div class="flex justify-between border-t border-blue-500/40 pt-3 text-sm">
                <div>
                    <span class="block text-blue-200 text-xs">Total Pemasukan</span>
                    <span id="totalMasuk" class="font-semibold">Rp 0</span>
                </div>
                <div class="text-right">
                    <span class="block text-blue-200 text-xs">Total Pengeluaran</span>
                    <span id="totalKeluar" class="font-semibold">Rp 0</span>
                </div>
            </div>
        </div>

        <!-- Form Input Cepat -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
            <h3 class="font-semibold text-slate-700 mb-3 text-sm">Input Transaksi Baru</h3>
            <form id="transactionForm" onsubmit="submitData(event)" class="space-y-3">
                <div>
                    <input type="text" id="inputText" required
                        placeholder="Contoh: beli sayur 15000 atau tambah saldo 5000000" 
                        class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                </div>
                <button type="submit" id="submitBtn"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition duration-200 text-sm shadow-md">
                    Simpan Transaksi
                </button>
            </form>
            <p id="statusMessage" class="text-xs text-center mt-2 hidden"></p>
        </div>

        <!-- Rekap per Kategori -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
            <h3 class="font-semibold text-slate-700 mb-3 text-sm">Rekap Pengeluaran per Kategori</h3>
            <div id="categoryList" class="space-y-2.5 text-sm">
                <p class="text-slate-400 text-xs text-center py-4">Memuat data...</p>
            </div>
        </div>

    </div>

    <!-- JavaScript Logika Frontend -->
    <script>
        // URL Web App Google Apps Script Anda
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzl_2jmImcasNiYhB929cgdxiCnQCL_4qJnqg5hDjSTg252Ni5KgsJj67RV2YGXe4R-/exec";

        // Format angka ke Rupiah
        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(angka);
        }

        // Ambil Data saat halaman dimuat
        async function loadData() {
            try {
                let response = await fetch(SCRIPT_URL);
                let data = await response.json();

                // Update Ringkasan
                document.getElementById('sisaSaldo').innerText = formatRupiah(data.sisaSaldo);
                document.getElementById('totalMasuk').innerText = formatRupiah(data.totalMasuk);
                document.getElementById('totalKeluar').innerText = formatRupiah(data.totalKeluar);

                // Update Rekap Kategori
                let catContainer = document.getElementById('categoryList');
                catContainer.innerHTML = '';

                let keys = Object.keys(data.rekapKategori);
                if (keys.length === 0) {
                    catContainer.innerHTML = '<p class="text-slate-400 text-xs text-center py-2">Belum ada pengeluaran tercatat.</p>';
                    return;
                }

                keys.forEach(cat => {
                    let amount = data.rekapKategori[cat];
                    let itemHTML = `
                        <div class="flex justify-between items-center py-2 border-b border-slate-100 last:border-none">
                            <span class="text-slate-600 font-medium">${cat}</span>
                            <span class="text-slate-900 font-semibold">${formatRupiah(amount)}</span>
                        </div>
                    `;
                    catContainer.innerHTML += itemHTML;
                });

            } catch (error) {
                console.error("Gagal memuat data:", error);
            }
        }

        // Kirim Data Transaksi Baru
        async function submitData(e) {
            e.preventDefault();
            let text = document.getElementById('inputText').value;
            let btn = document.getElementById('submitBtn');
            let msg = document.getElementById('statusMessage');

            btn.disabled = true;
            btn.innerText = "Menyimpan & Menganalisis...";
            msg.classList.remove('hidden');
            msg.className = "text-xs text-center mt-2 text-blue-500";
            msg.innerText = "AI sedang membaca teks...";

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Diperlukan untuk Apps Script Web App sederhana
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });

                // Karena mode 'no-cors', kita beri jeda sebentar lalu asumsikan berhasil
                setTimeout(() => {
                    document.getElementById('inputText').value = '';
                    btn.disabled = false;
                    btn.innerText = "Simpan Transaksi";
                    msg.className = "text-xs text-center mt-2 text-emerald-600";
                    msg.innerText = "Berhasil dicatat!";
                    
                    // Refresh data dashboard
                    loadData();

                    setTimeout(() => msg.classList.add('hidden'), 3000);
                }, 1500);

            } catch (error) {
                btn.disabled = false;
                btn.innerText = "Simpan Transaksi";
                msg.className = "text-xs text-center mt-2 text-rose-500";
                msg.innerText = "Gagal menyimpan data.";
            }
        }

        // Jalankan saat pertama buka
        loadData();
    </script>
</body>
</html>
